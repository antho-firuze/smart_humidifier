profiles:
  esp8266_wemos_d1_r2_mini:
    fqbn: esp8266:esp8266:d1_mini:baud=115200,xtal=80,eesz=4M2M,dbg=Disabled,lvl=None____,ip=lm2f,vt=flash,exception=disabled,stacksmash=disabled,wipe=none,ssl=all,mmu=3232,non32xfer=fast
    platforms:
      - platform: esp8266:esp8266 (3.1.2)
        platform_index_url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
    libraries:
      - Blynk (1.3.5)
      - Adafruit Unified Sensor (1.1.15)
      - Adafruit AHT10 (0.1.0)
      - Adafruit SSD1306 (2.5.17)
      - Adafruit BusIO (1.17.4)
      - Adafruit GFX Library (1.12.6)
      - 107-Arduino-littlefs (0.6.0)
      - WiFiManager (2.0.17)
      - WiFiWebServer (1.10.1)
      - ArduinoJson (7.4.3)
    programmer: ""
    port: /dev/cu.usbserial-A5069RR4
    port_config:
      baudrate: "115200"
      lineEnding: "\r\n"
      bits: "8"
      parity: none
      stop_bits: one
default_profile: esp8266_wemos_d1_r2_mini
